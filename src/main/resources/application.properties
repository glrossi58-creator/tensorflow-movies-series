spring.application.name=movie-recommendation

spring.r2dbc.url=${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/movie_recommendation}
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:postgres}
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/movie_recommendation}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/movie_recommendation}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:postgres}

tmdb.base-url=https://api.themoviedb.org/3
tmdb.read-access-token=${TMDB_READ_ACCESS_TOKEN:}
tmdb.connect-timeout=3s
tmdb.response-timeout=8s

recommendation.weights.genre=0.30
recommendation.weights.actor=0.20
recommendation.weights.director=0.20
recommendation.weights.movie=0.15
recommendation.weights.series=0.15
recommendation.ml.minimum-samples=${MODEL_MIN_DIRECT_RATINGS:8}
recommendation.ml.recommended-samples=${MODEL_RECOMMENDED_DIRECT_RATINGS:25}
recommendation.ml.auto-train-enabled=${MODEL_AUTO_TRAIN_ENABLED:true}
recommendation.ml.auto-train-new-ratings=${MODEL_AUTO_TRAIN_NEW_DIRECT_RATINGS:10}
recommendation.ml.epochs=150
recommendation.ml.learning-rate=0.08
recommendation.ml.seed=42
recommendation.ml.model-directory=${MODEL_DIRECTORY:./data/models}
recommendation.vector-weight=0.15

app.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=movie-recommendation
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.gilrossi.movie_recommendation.*
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.codec.max-in-memory-size=2MB
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000
